// 유틸: 문자열 정규화 (비교용)
function norm(s){
  return (s||"")
    .toLowerCase()
    .replace(/[\[\]\/,.;:"'()]/g,"")
    .replace(/\s+/g,"")
    .trim();
}
// contains 매칭: expected(콤마/슬래시로 구분된 키워드 배열)가 학생답에 모두 포함되는지
function containsAll(studentRaw, keywords){
  const s = norm(studentRaw);
  if(!s) return false;
  return keywords.every(k => s.includes(norm(k)));
}
function exactMatch(studentRaw, accepted){
  const s = norm(studentRaw);
  if(!s) return false;
  const list = Array.isArray(accepted) ? accepted : [accepted];
  return list.some(a => norm(a)===s);
}

function el(tag, attrs={}, html=""){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=> e.setAttribute(k,v));
  e.innerHTML = html;
  return e;
}

function buildNav(){
  const nav = document.getElementById('nav');
  SECTIONS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.textContent = s.title;
    b.dataset.index = i;
    b.onclick = ()=> showSection(i);
    nav.appendChild(b);
  });
}

function showSection(i){
  currentIndex = i;
  document.querySelectorAll('#sections .section').forEach((s,idx)=>{
    s.classList.toggle('active', idx===i);
  });
  document.querySelectorAll('nav button').forEach((b,idx)=>{
    b.classList.toggle('active', idx===i);
  });
  document.getElementById('prevBtn').style.visibility = i===0 ? 'hidden':'visible';
  document.getElementById('nextBtn').style.visibility = i===SECTIONS.length-1 ? 'hidden':'visible';
  window.scrollTo({top:0,behavior:'smooth'});
}

   "(c) In the production of ___, the constriction of the vocal tract is such that a noisy airstream is formed.",
   "(d) In the production of palato-alveolar sounds, the ___ of the tongue goes to the forward part of the...",
   "&nbsp;&nbsp;&nbsp;&nbsp;...forward part of the ___.",
   "(e) In the production of ___ sounds, the two lips approach one another, and the back of the tongue is raised toward the soft palate.",
  ];
  EX13.forEach((it,idx)=>{
    const box = el('div',{class:'item'});
    box.appendChild(el('div',{class:'prompt'}, groupLabels[idx]));
    let sel = `<select id="e13_${idx}"><option value="">-- 선택 --</option>`;

/* ========================= 채점 로직 ========================= */
function gradeAll(){
  const results = []; // {section, prompt, student, correct, ok}

  // Ex1
  EX1.forEach((it,idx)=>{
    const statusEl = document.querySelector(`input[name="e1_${idx}_status"]:checked`);
    const status = statusEl ? statusEl.value : "";
    const fix = document.getElementById(`e1_${idx}_fix`).value;
    let studentDisplay = status==="correct" ? "정확함" : (status==="wrong" ? `오류 → ${fix||"(미입력)"}` : "(미응답)");
    let ok=false, correctDisplay;
    if(it.correct){
      correctDisplay = `오류 → [${it.fix}]`;
      ok = status==="wrong" && containsAll(fix, [it.fix]);
    } else {
      correctDisplay = "정확함 (수정 불필요)";
      ok = status==="correct";
    }
    results.push({section:"1. 전사 교정", prompt:`${it.w} ${it.given}`, student:studentDisplay, correct:correctDisplay, ok});
  });

  // Ex2
  EX2.forEach(([w,ans],idx)=>{
    const v = document.getElementById(`e2_${idx}`).value;
    const ok = norm(v).replace(/[^\d,]/g,"") === norm(ans).replace(/[^\d,]/g,"");
    results.push({section:"2. 분절음·음절 수", prompt:w, student:v||"(미응답)", correct:ans, ok});
  });

  // Ex3
  EX3.forEach((it,idx)=>{
    const v = document.getElementById(`e3_${idx}`).value;
    const kws = [it[1], ...it[2].split(",").map(x=>x.trim())];
    const ok = containsAll(v, kws);
    results.push({section:"3. 초성 조음위치", prompt:it[0], student:v||"(미응답)", correct:`${it[1]}; ${it[2]}`, ok});
  });

  // Ex4
  EX4.forEach((it,idx)=>{
    const v = document.getElementById(`e4_${idx}`).value;
    const kws = [it[1], ...it[2].split(",").map(x=>x.trim())];
    const ok = containsAll(v, kws);
    results.push({section:"4. 종성 조음방식", prompt:it[0], student:v||"(미응답)", correct:`${it[1]}; ${it[2]}`, ok});
  });

  // Ex5
  EX5.forEach((it,idx)=>{
    const v = document.getElementById(`e5_${idx}`).value;
    const [word, sd, sym1, desc1, sym2, desc2] = it;
    const kws = sd==="Same" ? [sd, sym1] : [sd, sym1, sym2];
    const ok = containsAll(v, kws);
    const correctText = sd==="Same" ? `Same: /${sym1}/ ${desc1}` : `Different: /${sym1}/ ${desc1} – /${sym2}/ ${desc2}`;
    results.push({section:"5. 모음 비교", prompt:word, student:v||"(미응답)", correct:correctText, ok});
  });

  // Ex6
  EX6.forEach((it,idx)=>{
    const selected = it.words.filter((w,wi)=> document.getElementById(`e6_${idx}_${wi}`).checked);
    const selSet = selected.slice().sort().join(",");
    const corSet = it.correct.slice().sort().join(",");
    const ok = selSet === corSet;
    results.push({section:"6. 단어 고르기", prompt:it.crit, student: selected.join(", ")||"(선택 없음)", correct: it.correct.join(", "), ok});
  });

  // Ex7
  EX7_WORDS.forEach((w,ri)=>{
    const expected = EX7_DATA[w];
    for(let ci=0; ci<5; ci++){
      const v = document.getElementById(`e7_${ri}_${ci}`).value;
      const ok = exactMatch(v, expected[ci]) || (expected[ci]==="-" && norm(v)==="");
      results.push({section:"7. 음절 구조", prompt:`${w} — ${EX7_COLS[ci]}`, student:v||"(미응답)", correct:expected[ci], ok});
    }
  });

  // Ex8
  EX8.forEach((it,idx)=>{
    const v = document.getElementById(`e8_${idx}`).value;
    const symKw = it[1].split(",").map(x=>x.trim());
    const ok = containsAll(v, symKw);
    results.push({section:"8. 소리 자질 비교", prompt:it[0], student:v||"(미응답)", correct:`[${it[1]}] — 공유: ${it[2]}; 차이: ${it[3]}`, ok});
  });

  // Ex9
  EX9.forEach((it,idx)=>{
    const v = document.getElementById(`e9_${idx}`).value;
    const ok = containsAll(v, [it[1]]);
    results.push({section:"9. 그룹 판별", prompt:it[0], student:v||"(미응답)", correct:`/${it[1]}/ — ${it[2]}`, ok});
  });

  // Ex10 / Ex11
  function gradeArtTable(prefix, dataObj, rows, cols, sectionLabel){
    rows.forEach((rowName,ri)=>{
      cols.forEach((colName,ci)=>{
        const v = document.getElementById(`${prefix}_${ri}_${ci}`).value;
        const expected = dataObj[rowName][ci];
        const ok = containsAll(v, [expected]);
        results.push({section:sectionLabel, prompt:`${colName} — ${rowName}`, student:v||"(미응답)", correct:expected, ok});
      });
    });
  }
  gradeArtTable('e10', EX10_DATA, ART_ROWS, ART_WORDS, "10. 종성 조음기관");
  gradeArtTable('e11', EX11_DATA, ART_ROWS, ART_WORDS, "11. 초성 조음기관");
  gradeArtTable('e12', EX12_DATA, VOWEL_ROWS, VOWEL_WORDS, "12. 첫 모음 자질");

  // Ex13
  EX13.forEach((it,idx)=>{
    const v = document.getElementById(`e13_${idx}`).value;
    const ok = v === it.correct;
    results.push({section:"13. 올바른 대안", prompt:it.text, student:v||"(미응답)", correct:it.correct, ok});
  });

  return results;
}

/* ========================= PDF 생성 ========================= */
// 섹션(테이블) 하나를 오프스크린에 그려서 캔버스로 캡처한 뒤 즉시 정리
async function captureBlock(innerHtml, widthPx){
  const wrap = document.createElement('div');
  wrap.style.position = 'fixed';
  wrap.style.left = '-99999px';
  wrap.style.top = '0';
  wrap.style.width = widthPx + 'px';
  wrap.style.background = '#ffffff';
  wrap.style.color = '#1b1b1b';
  wrap.style.fontFamily = '"Noto Serif KR",Georgia,serif';
  wrap.style.padding = '18px 22px';
  wrap.innerHTML = `<style>
    table{width:100%;border-collapse:collapse;margin-bottom:4px;}
    th,td{border:1px solid #ccc;padding:5px 7px;font-size:12px;text-align:left;vertical-align:top;}
    th{background:#f1e6da;}
    td.ok{color:#2f6b3a;font-weight:bold;text-align:center;}
    td.no{color:#a13a2f;font-weight:bold;text-align:center;}
    h1{font-size:19px;margin:0 0 4px;}
    h3{font-size:14px;margin:0 0 8px;padding-bottom:4px;border-bottom:1.5px solid #8a3324;color:#8a3324;}
    .meta{font-size:12px;color:#555;margin-bottom:4px;}
    .totalbox{padding:12px 16px;border:1.5px solid #8a3324;border-radius:6px;font-size:14px;}
  </style>` + innerHtml;
  document.body.appendChild(wrap);
  await new Promise(r=>setTimeout(r,30));
  let canvas;
  try{
    canvas = await html2canvas(wrap, {scale:1.5, backgroundColor:"#ffffff", useCORS:true});
  } finally {
    wrap.remove();
  }
  return canvas;
}

async function generateReport(){
  const btn = document.getElementById('gradeBtn');
  const summaryEl = document.getElementById('scoreSummary');
  btn.disabled = true;
  btn.textContent = "채점 중...";
  summaryEl.textContent = "";

  try{
    if(!window.jspdf || !window.html2canvas){
      throw new Error("PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해서 다시 시도해주세요.");
    }

    const results = gradeAll();
    const total = results.length;
    const correctCount = results.filter(r=>r.ok).length;
    const pct = Math.round((correctCount/total)*1000)/10;

    summaryEl.innerHTML = `총 ${total}문항 중 <b>${correctCount}</b>문항 정답 (${pct}%)`;

    const name = document.getElementById('studentName').value || "이름 미입력";
    const today = new Date().toLocaleDateString('ko-KR');

    // 섹션별로 그룹화
    const bySection = {};
    results.forEach(r=>{
      if(!bySection[r.section]) bySection[r.section]=[];
      bySection[r.section].push(r);
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = 210, pageH = 297, margin = 0;
    const widthPx = 720;
    let yCursor = 0;
    let firstImage = true;

    function placeCanvas(canvas){
      const imgW = pageW;
      const imgH = canvas.height * imgW / canvas.width;
      const imgData = canvas.toDataURL('image/jpeg', 0.92);

      if(imgH > pageH){
        // 한 블록이 한 페이지보다 길면 슬라이스해서 여러 페이지에 나눠 붙임
        let heightLeft = imgH;
        let position = 0;
        if(!firstImage) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
        heightLeft -= pageH;
        while(heightLeft > 0){
          position = heightLeft - imgH;
          pdf.addPage();
          pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
          heightLeft -= pageH;
        }
        yCursor = 0; // 다음 블록은 새 페이지에서 시작
        firstImage = false;
        return;
      }

      if(firstImage){
        yCursor = 0;
        firstImage = false;
      } else if(yCursor + imgH > pageH){
        pdf.addPage();
        yCursor = 0;
      }
      pdf.addImage(imgData, 'JPEG', 0, yCursor, imgW, imgH);
      yCursor += imgH;
    }

    // 헤더 블록
    const headerHtml = `<h1>Phonetics Exercises — 채점 결과 보고서</h1><div class="meta">이름: ${escapeHtml(name)} &nbsp;|&nbsp; 채점일: ${today}</div>`;
    const headerCanvas = await captureBlock(headerHtml, widthPx);
    placeCanvas(headerCanvas);

    // 섹션별 블록 (섹션이 길면 자동으로 다음 페이지로 넘어감)
    for(const [sec, items] of Object.entries(bySection)){
      let rows = `<h3>${escapeHtml(sec)}</h3><table><tr><th style="width:28%">문항</th><th style="width:28%">학생 답</th><th style="width:32%">정답</th><th style="width:6%">채점</th></tr>`;
      items.forEach(it=>{
        rows += `<tr><td>${escapeHtml(it.prompt)}</td><td>${escapeHtml(it.student)}</td><td>${escapeHtml(it.correct)}</td><td class="${it.ok?'ok':'no'}">${it.ok?'O':'X'}</td></tr>`;
      });
      rows += `</table>`;
      const canvas = await captureBlock(rows, widthPx);
      placeCanvas(canvas);
    }

    // 총점 블록
    const totalHtml = `<div class="totalbox">총 ${total}문항 중 <b>${correctCount}</b>문항 정답 — 점수: <b>${pct}%</b></div>`;
    const totalCanvas = await captureBlock(totalHtml, widthPx);
    placeCanvas(totalCanvas);

    pdf.save(`Phonetics_채점표_${name}.pdf`);
  } catch(err){
    console.error(err);
    alert("PDF 생성 중 문제가 발생했습니다: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "채점하고 PDF 다운로드";
  }
}

function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

document.getElementById('nextBtn').onclick = ()=> showSection(Math.min(SECTIONS.length-1,currentIndex+1));
document.getElementById('gradeBtn').onclick = generateReport;
</script>
