<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빈칸 채우기 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #FAFAF6;
    --paper: #FFFFFF;
    --ink: #1B2A41;
    --ink-soft: #55606E;
    --navy: #1B3A63;
    --navy-dark: #12233F;
    --line: #DAD6C9;
    --good: #2F7A4E;
    --good-bg: #EAF3EC;
    --bad: #B3452C;
    --bad-bg: #FBEEEA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    line-height: 1.6;
  }

  .page {
    max-width: 700px;
    margin: 0 auto;
    padding: 64px 24px 100px;
  }

  header h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 700;
    font-size: 2rem;
    color: var(--navy-dark);
    margin: 0 0 6px;
  }

  header p {
    color: var(--ink-soft);
    margin: 0 0 40px;
    font-size: 0.98rem;
  }

  .question {
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
    font-size: 1.05rem;
  }

  .question:first-of-type {
    border-top: 1px solid var(--line);
  }

  .qnum {
    display: inline-block;
    min-width: 28px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    color: var(--navy);
    margin-right: 4px;
  }

  .blank {
    border: none;
    border-bottom: 2px solid var(--navy);
    background: transparent;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    padding: 2px 6px;
    min-width: 140px;
    text-align: center;
    margin: 0 2px;
  }

  .blank:focus {
    outline: none;
    border-bottom-color: var(--good);
    background: #F3F7F4;
  }

  .blank.correct {
    border-bottom-color: var(--good);
    background: var(--good-bg);
    color: var(--good);
    font-weight: 600;
  }

  .blank.incorrect {
    border-bottom-color: var(--bad);
    background: var(--bad-bg);
    color: var(--bad);
    font-weight: 600;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 40px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 13px 22px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
  }

  #submit-btn {
    background: var(--navy);
    color: #fff;
    font-weight: 600;
  }

  #submit-btn:hover { background: var(--navy-dark); }

  #answer-btn {
    background: transparent;
    color: var(--navy);
    border-color: var(--navy);
  }

  #answer-btn:hover { background: #EFF2F6; }

  #result {
    margin-top: 28px;
    font-size: 1rem;
    color: var(--ink-soft);
  }

  #result strong {
    color: var(--navy-dark);
    font-family: 'Source Serif 4', Georgia, serif;
  }

  /* 정답 보기 비밀번호 모달 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(18, 35, 63, 0.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--paper);
    border-radius: 6px;
    padding: 28px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.25rem;
    margin: 0 0 14px;
    color: var(--navy-dark);
  }

  .modal input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 1rem;
    margin-bottom: 10px;
  }

  .modal-error {
    color: var(--bad);
    font-size: 0.88rem;
    min-height: 18px;
    margin-bottom: 6px;
  }

  .modal-buttons {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 14px;
  }

  .modal-buttons button.secondary {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--line);
  }

  .answer-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .answer-list li {
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.98rem;
  }

  .answer-list li span.a-num {
    font-weight: 600;
    color: var(--navy);
    margin-right: 6px;
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <h1>English Vocabulary Quiz</h1>
    <p>빈칸에 알맞은 답을 입력한 뒤, 모두 작성되면 채점 결과를 PDF로 받을 수 있습니다.</p>
  </header>

  <div id="quiz-container"></div>

  <div class="actions">
    <button id="submit-btn">채점하고 PDF 받기</button>
    <button id="answer-btn">정답 보기</button>
  </div>

  <div id="result"></div>
</div>

<!-- 정답 보기: 비밀번호 입력 모달 -->
<div class="modal-overlay" id="pw-modal">
  <div class="modal">
    <h2>정답을 보려면 비밀번호를 입력하세요</h2>
    <input type="password" id="pw-input" placeholder="비밀번호">
    <div class="modal-error" id="pw-error"></div>
    <div class="modal-buttons">
      <button class="secondary" id="pw-cancel">취소</button>
      <button id="pw-confirm">확인</button>
    </div>
  </div>
</div>

<!-- 정답 리스트 모달 -->
<div class="modal-overlay" id="answer-modal">
  <div class="modal">
    <h2>정답</h2>
    <ul class="answer-list" id="answer-list"></ul>
    <div class="modal-buttons">
      <button class="secondary" id="answer-close">닫기</button>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     여기 questions 배열만 원하는 문제로 바꾸면 됩니다.
     text 안의 "___" 부분이 텍스트박스(빈칸)로 바뀝니다.
     ============================================================ */
  const questions = [
    { id: 1, text: "The capital of France is ___.", answer: "Paris" },
    { id: 2, text: "Water boils at ___ degrees Celsius.", answer: "100" },
    { id: 3, text: "___ is the largest planet in our solar system.", answer: "Jupiter" },
    { id: 4, text: "The chemical symbol for gold is ___.", answer: "Au" },
    { id: 5, text: "___ wrote the plays Hamlet and Macbeth.", answer: "Shakespeare" }
  ];

  const ANSWER_PASSWORD = "mk316d";

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    questions.forEach(q => {
      const div = document.createElement('div');
      div.className = 'question';
      const parts = q.text.split('___');
      div.innerHTML =
        `<span class="qnum">${q.id}.</span>${parts[0]}` +
        `<input type="text" class="blank" id="blank-${q.id}" autocomplete="off">` +
        `${parts[1] || ''}`;
      container.appendChild(div);
    });
  }
  renderQuiz();

  function normalize(s) {
    return s.trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function gradeQuiz() {
    let score = 0;
    const results = questions.map(q => {
      const input = document.getElementById(`blank-${q.id}`);
      const userAnswer = input.value.trim();
      const correct = normalize(userAnswer) === normalize(q.answer);
      if (correct) score++;
      input.classList.remove('correct', 'incorrect');
      input.classList.add(correct ? 'correct' : 'incorrect');
      return {
        id: q.id,
        question: q.text.replace('___', '_____'),
        userAnswer: userAnswer || '(빈칸)',
        correctAnswer: q.answer,
        correct
      };
    });
    return { score, total: questions.length, results };
  }

  function generatePDF(score, total, results) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const marginLeft = 20;
    let y = 24;

    doc.setFontSize(17);
    doc.text('Quiz Result Report', marginLeft, y);
    y += 10;

    doc.setFontSize(11);
    doc.setTextColor(90, 90, 90);
    const now = new Date();
    doc.text(`Date: ${now.toLocaleString()}`, marginLeft, y);
    y += 8;

    doc.setFontSize(13);
    doc.setTextColor(20, 30, 50);
    doc.text(`Score: ${score} / ${total}`, marginLeft, y);
    y += 12;

    doc.setDrawColor(210, 210, 200);
    doc.line(marginLeft, y, 190, y);
    y += 10;

    results.forEach(r => {
      if (y > 265) {
        doc.addPage();
        y = 24;
      }
      doc.setFontSize(11);
      doc.setTextColor(20, 30, 50);
      const qLines = doc.splitTextToSize(`${r.id}. ${r.question}`, 165);
      doc.text(qLines, marginLeft, y);
      y += qLines.length * 6 + 2;

      doc.setTextColor(r.correct ? 47 : 179, r.correct ? 122 : 69, r.correct ? 78 : 44);
      doc.text(
        `   Your answer: ${r.userAnswer}   |   Correct answer: ${r.correctAnswer}   |   ${r.correct ? 'Correct' : 'Incorrect'}`,
        marginLeft,
        y
      );
      y += 10;
    });

    doc.save('quiz_result.pdf');
  }

  document.getElementById('submit-btn').addEventListener('click', () => {
    const unanswered = questions.filter(
      q => document.getElementById(`blank-${q.id}`).value.trim() === ''
    );
    if (unanswered.length > 0) {
      alert('아직 답을 입력하지 않은 문제가 있습니다.');
      return;
    }
    const { score, total, results } = gradeQuiz();
    generatePDF(score, total, results);
    document.getElementById('result').innerHTML =
      `<strong>${score} / ${total}</strong> 문제를 맞혔습니다. PDF 리포트가 다운로드되었습니다.`;
  });

  /* ---------------- 정답 보기 (비밀번호 보호) ---------------- */
  const pwModal = document.getElementById('pw-modal');
  const pwInput = document.getElementById('pw-input');
  const pwError = document.getElementById('pw-error');
  const answerModal = document.getElementById('answer-modal');

  document.getElementById('answer-btn').addEventListener('click', () => {
    pwInput.value = '';
    pwError.textContent = '';
    pwModal.classList.add('open');
    pwInput.focus();
  });

  document.getElementById('pw-cancel').addEventListener('click', () => {
    pwModal.classList.remove('open');
  });

  function tryUnlockAnswers() {
    if (pwInput.value === ANSWER_PASSWORD) {
      pwModal.classList.remove('open');
      showAnswers();
    } else {
      pwError.textContent = '비밀번호가 올바르지 않습니다.';
    }
  }

  document.getElementById('pw-confirm').addEventListener('click', tryUnlockAnswers);
  pwInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlockAnswers();
  });

  function showAnswers() {
    const list = document.getElementById('answer-list');
    list.innerHTML = '';
    questions.forEach(q => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="a-num">${q.id}.</span>${q.answer}`;
      list.appendChild(li);
    });
    answerModal.classList.add('open');
  }

  document.getElementById('answer-close').addEventListener('click', () => {
    answerModal.classList.remove('open');
  });
</script>

</body>
</html>
